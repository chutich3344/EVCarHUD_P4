<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUD Trạm sạc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Cung phong cach noi mem (neumorphism) xanh la voi trang web evcarhud.com/tram-sac, ban toi */
:root{--a1:#4ade80;--a2:#059669;--acc:#4ade80;--g:linear-gradient(90deg,var(--a1),var(--a2));
  --bg:#0f1d16;--hi:#1a2e23;--lo:#050c08;--tx:#ecfdf3;--mut:#9dbcaa;--soft:#132419;--trk:#07110c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:'Montserrat',system-ui,sans-serif;font-size:14px}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
.wrap{max-width:480px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 22px calc(124px + env(safe-area-inset-bottom))}
.raise{background:var(--bg);box-shadow:7px 7px 16px var(--lo),-7px -7px 16px var(--hi)}
.raise-s{background:var(--bg);box-shadow:4px 4px 9px var(--lo),-4px -4px 9px var(--hi)}
.inset{background:var(--bg);box-shadow:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi)}
.grad{background:var(--g);color:#fff;box-shadow:0 10px 22px color-mix(in srgb,var(--a2) 42%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.grad.stop{background:linear-gradient(90deg,#f87171,#dc2626);box-shadow:0 10px 22px rgba(220,38,38,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.c{display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.mut{color:var(--mut)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border-radius:16px;padding:16px;font-weight:700;font-size:15px}
.btn.sm{padding:12px;font-size:13.5px;border-radius:14px;font-weight:600}
.btn.ol{border:2px solid var(--a2);padding:12px}
.pill{border-radius:12px;padding:9px 14px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--mut)}
.pill.grad{color:#fff}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 2px 12px}
.sec b{font-weight:700;font-size:17px}
.f{border:0;border-radius:14px;padding:14px 16px;font-size:14px;font-weight:500;width:100%;outline:none;background:var(--bg);box-shadow:inset 5px 5px 10px var(--lo),inset -5px -5px 10px var(--hi)}
.f::placeholder{color:var(--mut)}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:16px 4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:6px 22px 14px}
.chips.scroll::-webkit-scrollbar{display:none}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hide{display:none!important}
/* O tim trang nhu web */
.field{display:flex;align-items:center;gap:10px;border-radius:16px;padding:0 18px;height:52px;background:linear-gradient(180deg,#fff,#e3e5ea);color:#23263a;box-shadow:6px 8px 16px var(--lo),-5px -5px 12px var(--hi)}
.field input{flex:1;min-width:0;border:0;outline:none;background:none;color:#23263a;font-weight:600;font-size:14.5px;padding:0;height:100%}
.field input::placeholder{color:#6f7489;font-weight:500}
/* Xem truoc HUD: man den nhu trang "Gui len HUD" cua web */
.hudscr{border-radius:18px;background:#000;display:flex;align-items:center;gap:16px;padding:18px}
.ring{width:66px;height:66px;border-radius:50%;border:2px solid var(--a1);display:flex;align-items:center;justify-content:center;color:var(--a1);flex:none}
#arrow{transition:transform .4s ease}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(74,222,128,.14);color:#bbf7d0;white-space:nowrap}
.tag.w{background:rgba(255,255,255,.10);color:rgba(255,255,255,.85)}
/* The so lieu */
.stat{border-radius:20px;padding:14px;min-width:0;text-align:left}
.stat .l{font-size:11.5px;font-weight:600;color:var(--mut)}
.stat .v{font-weight:700;font-size:18px;margin-top:2px}
.stat .s{font-size:12px;font-weight:600;color:var(--a1)}
.ic{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;color:var(--mut)}
.ic.grad{color:#fff}
.ic.off{background:linear-gradient(90deg,#f87171,#dc2626);color:#fff}
/* Danh sach tram */
.lst{background:var(--soft);border-radius:22px;padding:2px 16px;box-shadow:10px 12px 24px var(--lo),-6px -6px 14px var(--hi)}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;width:100%;text-align:left}
.row+.row{border-top:1.5px dashed color-mix(in srgb,var(--mut) 45%,transparent)}
.row.sel{background:color-mix(in srgb,var(--a1) 12%,transparent);border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--a1);padding:14px 10px;margin:4px -10px;width:calc(100% + 20px)}
.row.sel+.row,.row+.row.sel{border-top-color:transparent}
.dir{width:38px;height:38px;color:var(--mut)}
.dir.grad{color:#fff}
/* Thanh dieu huong noi nhu web */
/* Thanh menu duoi kieu B "vien thuoc truot" (nguoi dung chot 2026-11-05): nut dang chon la vien xanh no ra kem chu */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:calc(100% - 36px);max-width:444px;height:66px;border-radius:99px;padding:0 8px;background:var(--soft);box-shadow:8px 8px 18px var(--lo),-6px -6px 14px var(--hi);display:flex;align-items:center;gap:2px;z-index:10}
.nav>button{flex:1 1 0;min-width:0;height:46px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:7px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;transition:flex-grow .45s cubic-bezier(.65,0,.35,1),background .3s,color .3s}
.nav>button span{max-width:0;opacity:0;transition:max-width .45s,opacity .3s}
.nav>button.on{flex-grow:2.3;background:var(--g);color:#fff;box-shadow:0 8px 18px color-mix(in srgb,var(--a2) 45%,transparent)}
.nav>button.on span{max-width:90px;opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
    <div style="min-width:0">
      <div class="mut ell" style="font-size:12.5px;font-weight:600" id="sub">Gửi trạm sạc lên HUD qua Bluetooth</div>
      <div style="font-size:22px;font-weight:800;margin-top:2px">HUD Trạm sạc</div>
    </div>
    <div style="display:flex;gap:12px;flex:none">
<button class="c raise" style="width:48px;height:48px;color:var(--tx)" aria-label="Cài đặt" onclick="document.getElementById('setTop').scrollIntoView({behavior:'smooth'})"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></button>
    <button class="c raise" id="btOrb" aria-label="Chọn HUD" style="width:48px;height:48px" onclick="A.pickHud()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10-5 5V2l5 5L7 17"></path></svg>
    </button>
    </div>
  </div>

  <!-- Xem truoc HUD -->
  <div class="raise" style="border-radius:24px;padding:16px;margin-top:22px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px">
      <span class="mut" style="font-size:11.5px;font-weight:700;letter-spacing:.06em" id="head">TRẠM SẠC GẦN NHẤT</span>
      <button class="pill raise-s hide" id="clearT" style="padding:6px 12px;font-size:11.5px;color:var(--tx)" onclick="A.clearTarget()">Bỏ chọn</button>
    </div>
    <div class="inset" style="border-radius:22px;padding:8px">
      <div class="hudscr">
        <div class="ring"><svg id="arrow" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2 5 21l7-4 7 4z"></path></svg></div>
        <div style="min-width:0;flex:1">
          <div style="font-size:30px;font-weight:800;color:#fff;line-height:1.05;font-variant-numeric:tabular-nums" id="dist">—</div>
          <div style="font-size:13.5px;color:var(--a1);font-weight:700;margin-top:3px" class="ell" id="name">Bấm Bắt đầu</div>
          <div class="chips" style="margin-top:8px;gap:6px" id="tags"></div>
        </div>
      </div>
    </div>
    <div class="mut" style="font-size:11.5px;font-weight:500;margin:12px 2px 0" id="side">Khoảng cách đường chim bay</div>
    <button class="btn grad" id="sendBtn" style="margin-top:12px" onclick="A.sendNow()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4M13 6l-3 4h4l-3 4"></path></svg>Gửi lên HUD</button>
    <div style="font-size:11.5px;color:var(--a1);font-weight:600;margin:8px 2px 0;text-align:center" class="hide" id="sent"></div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px">
    <div class="stat raise">
      <div class="ic inset" id="gpsOrb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg></div>
      <div class="l">GPS</div>
      <div class="v" id="spd">— km/h</div>
      <div class="s ell" id="gps">Chưa bật</div>
    </div>
    <button class="stat raise" onclick="A.pickHud()">
      <div class="ic inset" id="hudOrb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></div>
      <div class="l">HUD</div>
      <div class="v ell" id="hudName">Chưa chọn</div>
      <div class="s ell" id="hud">Chạm để chọn HUD</div>
    </button>
  </div>

  <button class="btn grad" style="margin-top:18px" id="run" onclick="A.toggle()">Bắt đầu</button>

  <div class="sec"><b>Trạm quanh xe</b><span class="mut" style="font-size:12px;font-weight:500">chạm để chọn trạm đích</span></div>
  <label class="field" for="q">
    <input id="q" list="names" placeholder="Lọc theo tên trạm, hãng…" autocomplete="off" oninput="draw()" aria-label="Lọc trạm">
    <button class="hide" id="qx" aria-label="Xoá lọc" onclick="$('q').value='';draw()" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#23263a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
  </label>
  <datalist id="names"></datalist>
  <div class="chips scroll" id="flt" style="margin-top:12px"></div>
  <div class="mut" style="font-size:12px;font-weight:500;margin:0 2px 12px" id="data">—</div>
  <div class="lst" id="list"><div class="row mut">Chưa có trạm</div></div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px">
    <button class="btn sm ol" onclick="A.openHub('#/ban-do')">Bản đồ trạm sạc</button>
    <button class="btn sm ol" onclick="A.sendTest()">Gửi thử lên HUD</button>
  </div>

  <div class="sec" id="setTop"><b>Cài đặt</b></div>
  <div class="raise" style="border-radius:24px;padding:4px 16px 18px">
    <span class="lbl">Nguồn dữ liệu trạm sạc</span>
    <div class="chips" id="src"></div>
    <div id="ocmBox" class="hide">
      <label class="lbl" for="ocm">Khóa OpenChargeMap</label>
      <input class="f" id="ocm" placeholder="Dán khóa API" onchange="A.setOcmKey(this.value)">
    </div>
    <span class="lbl">Chạy khi tắt màn hình</span>
    <button class="raise-s" id="batt" style="width:100%;border-radius:14px;padding:12px 14px;text-align:left;display:flex;align-items:center;gap:12px;font-weight:600;font-size:13px" onclick="A.battery()">
      <span class="ic inset" id="battOrb" style="width:30px;height:30px;border-radius:10px;margin:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="18" height="10" rx="2"></rect><path d="M22 11v2"></path></svg></span>
      <span style="flex:1" id="battTxt">Chưa cho phép: bấm để mở cài đặt pin</span>
    </button>
    <label class="lbl" for="rad">Bán kính tìm (km)</label>
    <input class="f" id="rad" type="number" min="2" max="50" inputmode="numeric" onchange="A.setRadius(parseInt(this.value)||15)">
  </div>
</div>

<nav class="nav" aria-label="Điều hướng">
  <button aria-label="Trang chủ" onclick="A.openHub('')"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"></path></svg><span>Trang chủ</span></button>
  <button aria-label="Bản đồ" onclick="A.openHub('#/ban-do')"><svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 6.5 9 4v14l-6 2.5zM10 4l5 2v14l-5-2zM16 6l6-2.5v14L16 20z"></path></svg><span>Bản đồ</span></button>
  <button aria-label="Gửi điểm sạc mới" onclick="A.openHub('#/gui')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span>Gửi trạm</span></button>
  <button aria-label="Tìm trạm" onclick="A.openHub('#/tim')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"></circle><path d="m21 21-4.3-4.3"></path></svg><span>Tìm</span></button>
  <button class="on" aria-label="HUD" onclick="scrollTo({top:0,behavior:'smooth'})"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4M13 6l-3 4h4l-3 4"></path></svg><span>HUD</span></button>
</nav>

<script>
// Cau noi toi app (Android.*). Mo bang trinh duyet thuong thi dung du lieu gia de xem giao dien.
var A = window.Android || {
  state: function(){return JSON.stringify({running:false,gps:'Chưa bật',hud:'Chưa chọn HUD',hudName:'',data:'—',speed:0,target:false,picked:null,list:[],source:'vf_osm',sources:[['vf_osm','VinFast + OSM']],radius:15,ocmKey:''})},
  toggle:function(){},sendNow:function(){},battery:function(){},pickHud:function(){},sendTest:function(){},openHub:function(){},clearTarget:function(){},
  setTarget:function(){},setSource:function(){},setRadius:function(){},setOcmKey:function(){}
};
var SIDE = {A:'thẳng phía trước',R:'bên phải',L:'bên trái',B:'phía sau','?':'chưa biết hướng xe'};
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function km(m){return m<1000? m+' m' : (m/1000).toFixed(m<10000?1:0).replace('.',',')+' km'}
var S = null, F = {kw:0, op:'', side:''};
var FILTERS = [['Tất cả',{kw:0,op:'',side:''}],['VinFast',{op:'vinfast'}],['Hãng khác',{op:'other'}],['Phía trước',{side:'front'}],['≥ 22 kW',{kw:22}],['≥ 60 kW',{kw:60}],['≥ 120 kW',{kw:120}]];
function setF(i){ var f = FILTERS[i][1]; if (i == 0) F = {kw:0,op:'',side:''}; else for (var k in f) F[k] = (F[k] === f[k] ? (k=='kw'?0:'') : f[k]); draw(); }
function fOn(i){ var f = FILTERS[i][1]; if (i == 0) return !F.kw && !F.op && !F.side; for (var k in f) if (F[k] !== f[k]) return false; return true; }
function norm(x){ return String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d'); }
function draw(){
  var s = S; if (!s) return;
  var L = (s.list || []).map(function(t, i){ t.i = i; return t; });
  var q = norm($('q').value); $('qx').classList.toggle('hide', !q);
  var V = L.filter(function(t){
    if (q && norm(t.name + ' ' + t.op).indexOf(q) < 0) return false;
    if (F.kw && !(t.kw >= F.kw)) return false;
    if (F.op == 'vinfast' && !/vinfast/i.test(t.op + ' ' + t.name)) return false;
    if (F.op == 'other' && /vinfast/i.test(t.op + ' ' + t.name)) return false;
    if (F.side == 'front' && !(t.side == 'A' || t.side == 'L' || t.side == 'R')) return false;
    return true;
  });
  $('flt').innerHTML = FILTERS.map(function(f, i){ return '<button class="pill ' + (fOn(i) ? 'grad' : 'raise-s') + '" onclick="setF(' + i + ')">' + f[0] + '</button>'; }).join('');
  var seen = {}; $('names').innerHTML = L.filter(function(t){ if (seen[t.name]) return false; return seen[t.name] = 1; }).slice(0, 80)
    .map(function(t){ return '<option value="' + esc(t.name) + '">'; }).join('');
  var shown = V.slice(0, 60);
  $('list').innerHTML = shown.length ? shown.map(function(t, j){
    var sel = s.targetKey && t.key == s.targetKey;
    return '<button class="row' + (sel ? ' sel' : '') + '" onclick="pick(' + t.i + ')">' +
      '<div class="c dir ' + (sel || (!s.targetKey && t.i == 0) ? 'grad' : 'inset') + '"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="transform:rotate(' + (t.rel == null ? 0 : t.rel) + 'deg)"><path d="M12 2 5 21l7-4 7 4z"></path></svg></div>' +
      '<div style="flex:1;min-width:0"><div class="ell" style="font-weight:600">' + esc(t.name) + '</div><div class="mut ell" style="font-size:11.5px;font-weight:500;margin-top:2px">' + esc([sel ? 'Đang chọn' : '', t.op, t.ports ? t.ports + ' cổng' : '', SIDE[t.side] || ''].filter(Boolean).join(' · ')) + '</div></div>' +
      '<div style="text-align:right;font-weight:700;font-size:14px;white-space:nowrap">' + km(t.dist) + (t.kw ? '<div style="font-size:11.5px;color:var(--a1)">' + t.kw + ' kW</div>' : '') + '</div></button>';
  }).join('') + (V.length > shown.length ? '<div class="row mut" style="font-size:12px">+ ' + (V.length - shown.length) + ' trạm nữa, gõ tên để lọc</div>' : '')
    : '<div class="row mut">' + (L.length ? 'Không có trạm khớp bộ lọc' : s.running ? 'Chưa có trạm trong bán kính' : 'Bấm Bắt đầu để tìm trạm') + '</div>';
  $('data').textContent = s.data + (L.length ? ' · đang hiện ' + V.length + '/' + L.length : '');
}
function pick(i){ A.setTarget(i); scrollTo({top:0,behavior:'smooth'}); }
function render(s){
  $('run').textContent = s.running ? 'Dừng' : 'Bắt đầu';
  $('run').classList.toggle('stop', s.running);
  $('gps').textContent = s.gps; $('spd').textContent = (s.running ? s.speed : '—') + ' km/h';
  $('gpsOrb').className = 'ic ' + (/Có vị trí/.test(s.gps) ? 'grad' : 'inset');
  $('hudName').textContent = s.hudName || 'Chưa chọn';
  $('hud').textContent = s.hud;
  var ok = /Đã kết nối/.test(s.hud);
  $('hudOrb').className = 'ic ' + (ok ? 'grad' : 'inset'); $('btOrb').className = 'c ' + (ok ? 'grad' : 'raise');
  $('head').textContent = s.target ? 'TRẠM ĐANG CHỌN' : 'TRẠM SẠC GẦN NHẤT';
  $('clearT').classList.toggle('hide', !s.target);
  var ago = s.sentAt ? Math.round((Date.now() - s.sentAt) / 1000) : -1;
  $('sent').classList.toggle('hide', ago < 0 || ago > 120 || !/Đã kết nối/.test(s.hud));
  if (ago >= 0) $('sent').textContent = 'Đã gửi lên HUD ' + (ago < 5 ? 'vừa xong' : ago + ' giây trước');
  var p = s.picked;
  if (p) {
    $('name').textContent = p.name; $('dist').textContent = p.dist == null ? '—' : km(p.dist);
    if (p.dist == null) $('side').textContent = 'Đang chờ GPS để tính khoảng cách';
    var T = [];
    if (p.side && p.side != '?') T.push('<span class="tag">' + SIDE[p.side].replace(/^./, function(c){return c.toUpperCase()}) + '</span>');
    if (p.kw) T.push('<span class="tag w">' + p.kw + ' kW</span>'); if (p.ports) T.push('<span class="tag w">' + p.ports + ' cổng</span>');
    if (p.op && p.op != p.name) T.push('<span class="tag w">' + esc(p.op) + '</span>');
    $('tags').innerHTML = T.join('');
    $('arrow').style.transform = 'rotate(' + (p.rel == null ? 0 : p.rel) + 'deg)';
    if (p.dist != null) $('side').textContent = p.side == '?' ? 'Chưa biết hướng xe (xe đứng yên) · khoảng cách đường chim bay' : 'Khoảng cách đường chim bay';
  } else {
    $('name').textContent = s.running ? 'Đang tìm trạm…' : 'Bấm Bắt đầu'; $('dist').textContent = '—';
    $('tags').innerHTML = ''; $('arrow').style.transform = 'rotate(0deg)';
  }
  S = s; draw();
  $('src').innerHTML = s.sources.map(function(o){
    return '<button class="pill ' + (o[0] == s.source ? 'grad' : 'raise-s') + '" onclick="A.setSource(\'' + o[0] + '\')">' + esc(o[1]) + '</button>';
  }).join('');
  $('battTxt').textContent = s.battOk ? 'Đã cho phép chạy nền không giới hạn pin' : 'Chưa cho phép: bấm để mở cài đặt pin';
  $('battOrb').className = 'ic ' + (s.battOk ? 'grad' : 'off');
  $('ocmBox').classList.toggle('hide', s.source != 'ocm');
  if (document.activeElement != $('rad')) $('rad').value = s.radius;
  if (document.activeElement != $('ocm')) $('ocm').value = s.ocmKey;
}
window.onState = function(json){ render(typeof json == 'string' ? JSON.parse(json) : json) };
render(JSON.parse(A.state()));
</script>
</body>
