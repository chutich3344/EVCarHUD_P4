<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Cảnh 3D LANE</title>
<style>
/* Man canh lai 3D cua app LANE: Kotlin goi feed(json) moi lan AI chay (5–20 lan/giay), trang tu noi suy 60 khung/giay */
@font-face { font-family: BVP; src: url("../fonts/BeVietnamPro-Bold.ttf"); font-weight: 700; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #15181d; font-family: BVP, "Roboto", sans-serif; }
canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
.hud { position: absolute; left: 3.5vw; top: 4vh; display: flex; flex-direction: column; gap: 0.4vh; pointer-events: none; color: var(--ink); }
body.night { --ink: #f4f6f9; --sub: #c9d0da; --chip: rgba(255,255,255,.12); background: #15181d; }
body.day { --ink: #16191e; --sub: #3d4550; --chip: rgba(0,0,0,.08); background: #e4e7eb; }
.spd { font-weight: 800; font-size: 13vh; line-height: .95; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.unit { font-weight: 700; font-size: 2.8vh; color: var(--sub); }
.chips { display: flex; flex-wrap: wrap; gap: 1vh; margin-top: 1.4vh; max-width: 60vw; }
.chip { font-weight: 700; font-size: 2.5vh; padding: .6vh 1.6vh; border-radius: 99px; background: var(--chip); font-variant-numeric: tabular-nums; }
.chip.lead { background: #2f7bff; color: #fff; }
.chip.warn { background: #ffb020; color: #1a1300; }
.chip.dang { background: #ff3b3b; color: #fff; }
.vbtn { position: absolute; right: 2.5vw; bottom: 4vh; font-weight: 700; font-size: 2.6vh; padding: 1.2vh 2.2vh; border-radius: 99px;
  background: var(--chip); color: var(--ink); border: 0; -webkit-tap-highlight-color: transparent; backdrop-filter: blur(6px); }
.vbtn:active { transform: scale(.95); }
.wait { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); font-weight: 700; font-size: 3vh; color: var(--sub); }
</style>
</head>
<body class="night">
<div class="hud"><div class="spd" id="spd">0</div><div class="unit">km/h</div><div class="chips" id="chips"></div></div>
<button class="vbtn" id="vbtn">🎥 Sau xe</button>
<div class="wait" id="wait">Đang chờ AI…</div>
<script src="three.min.js"></script>
<script>
"use strict";
const N = 33, X_IDX = []; for (let i = 0; i < N; i++) X_IDX.push(192 * (i / 32) * (i / 32));
const THEMES = {
  night: { bg: 0x15181d, fog: [30, 140], ground: 0x1b1f25, road: 0x2b3038, line: 0xdfe4ea, edge: 0x6d7682, wall: 0x3a414b,
           car: 0x8d96a1, ego: 0xf2f4f6, glass: 0x1a1f26, lead: 0xdde6f3, shadow: 0.55, hemi: [0xcfd8e6, 0x15181d, 0.75], sun: 0.85,
           opp: 0x262b33, walk: 0x343a43, yel: 0xffc21a, onc: 0xa39a8c },
  day:   { bg: 0xe4e7eb, fog: [30, 150], ground: 0xd9dce1, road: 0xbfc4cb, line: 0xffffff, edge: 0x8d949d, wall: 0xa9afb7,
           car: 0x7b838d, ego: 0xffffff, glass: 0x2a313a, lead: 0x4b5566, shadow: 0.28, hemi: [0xffffff, 0xb9bec5, 0.85], sun: 0.75,
           opp: 0xb3b8c0, walk: 0xcdd1d6, yel: 0xe2a400, onc: 0x8a8173 },
};
let theme = 'night';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: !!window.SIM });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(46, 16 / 9, 0.1, 400);
const hemi = new THREE.HemisphereLight(0xffffff, 0x222222, 0.8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(-6, 14, 8); scene.add(sun);

// ---- dai bang tren mat duong ----
const XS = []; for (let i = 0; i <= 70; i++) XS.push(i <= 30 ? -8 + i : 22 + (i - 30) * 1.6);
function ribbon(color, opacity, h, uvLen) {
  const g = new THREE.BufferGeometry(), n = XS.length;
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 6), 3));
  g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 4), 2));
  const idx = []; for (let i = 0; i < n - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  g.setIndex(idx);
  const m = new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: opacity >= 1, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(g, m); mesh.userData = { h, uvLen }; mesh.frustumCulled = false; scene.add(mesh); return mesh;
}
function setRibbon(mesh, L, R, odo, vfun) {
  const p = mesh.geometry.attributes.position.array, uv = mesh.geometry.attributes.uv.array, h = mesh.userData.h;
  for (let i = 0; i < XS.length; i++) {
    p[i * 6] = L[i]; p[i * 6 + 1] = h; p[i * 6 + 2] = -XS[i];
    p[i * 6 + 3] = R[i]; p[i * 6 + 4] = h; p[i * 6 + 5] = -XS[i];
    const v = vfun ? vfun(XS[i]) : mesh.userData.uvLen ? (XS[i] + (odo || 0)) / mesh.userData.uvLen : 0;
    uv[i * 4] = 0; uv[i * 4 + 1] = v; uv[i * 4 + 2] = 1; uv[i * 4 + 3] = v;
  }
  mesh.geometry.attributes.position.needsUpdate = true; mesh.geometry.attributes.uv.needsUpdate = true;
}
function wallMesh() {
  const g = new THREE.BufferGeometry(), n = XS.length;
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 6), 3));
  const idx = []; for (let i = 0; i < n - 1; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); } g.setIndex(idx);
  const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false }));
  mesh.frustumCulled = false; scene.add(mesh); return mesh;
}
function setWall(mesh, Y, hgt) {
  const p = mesh.geometry.attributes.position.array;
  for (let i = 0; i < XS.length; i++) { p[i * 6] = Y[i]; p[i * 6 + 1] = 0; p[i * 6 + 2] = -XS[i]; p[i * 6 + 3] = Y[i]; p[i * 6 + 4] = hgt; p[i * 6 + 5] = -XS[i]; }
  mesh.geometry.attributes.position.needsUpdate = true;
}
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return new THREE.CanvasTexture(c); }
const dashTex = canvasTex(4, 64, (x, w, h) => { x.fillStyle = '#000'; x.fillRect(0, 0, w, h); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h * 0.38); });
dashTex.wrapT = THREE.RepeatWrapping;
const pathTex = canvasTex(64, 256, (x, w, h) => { const g = x.createLinearGradient(0, h, 0, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.1, 'rgba(255,255,255,.95)'); g.addColorStop(0.55, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, w, h); const s = x.createLinearGradient(0, 0, w, 0); s.addColorStop(0, 'rgba(0,0,0,1)'); s.addColorStop(.18, 'rgba(0,0,0,0)'); s.addColorStop(.82, 'rgba(0,0,0,0)'); s.addColorStop(1, 'rgba(0,0,0,1)');
  x.globalCompositeOperation = 'destination-out'; x.fillStyle = s; x.fillRect(0, 0, w, h); });
const shadowTex = canvasTex(64, 128, (x, w, h) => { const g = x.createRadialGradient(w / 2, h / 2, 4, w / 2, h / 2, w / 2);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.save(); x.scale(1, 2); x.fillStyle = g; x.fillRect(0, 0, w, h / 2); x.restore(); });

const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshBasicMaterial({ color: 0x222222 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; scene.add(ground);
const road = ribbon(0x333333, 1, 0.0);
const shoulderL = ribbon(0x777777, 1, 0.005), shoulderR = ribbon(0x777777, 1, 0.005);
const lines = [0, 1, 2, 3].map(() => { const m = ribbon(0xffffff, 1, 0.012, 12); m.material.alphaMap = dashTex; m.material.transparent = true; m.material.depthWrite = false; return m; });
const path = ribbon(0x3e8bff, 0.9, 0.02); path.material.alphaMap = pathTex; path.material.transparent = true; path.material.depthWrite = false;
const wallL = wallMesh(), wallR = wallMesh();
// 23/11 (3DLANE-02): duong 2 chieu - openpilot chi cho mep phan duong chieu minh, xe nguoc chieu / xe do ben kia truoc day nam lo lung ngoai duong.
// Thay xe ben ngoai mep trai -> ve them phan duong NGUOC CHIEU (mau hoi khac), vach tim vang doi o mep trai, vach dut giua phan ben kia.
// Thay xe do ngoai mep phai -> ve dai le/cho do xe.
const oppRoad = ribbon(0x333333, 1, 0.001), oppEdge = ribbon(0x777777, 1, 0.005);
const yelA = ribbon(0xffc21a, 1, 0.013), yelB = ribbon(0xffc21a, 1, 0.013);
const oppLine = ribbon(0xffffff, 1, 0.012, 12); oppLine.material.alphaMap = dashTex; oppLine.material.transparent = true; oppLine.material.depthWrite = false;
const walkR = ribbon(0x555555, 1, 0.004), walkL = ribbon(0x555555, 1, 0.004);
const wallO = wallMesh();
let oppW = 0, oppAt = -99, oppMax = 0, parkW = 0, parkAt = -99, parkMax = 0;
// 23/11 (video so sanh): duong 2 lan 2 chieu - openpilot coi lan nguoc chieu la 1 lan cua minh (mep trai = mep duong that).
// Con >= 2,5 m giua vach trai lan minh va mep trai -> do la lan NGUOC CHIEU: vach trai lan minh = tim vang, xe ben do quay dau.
// Chi bo khi thay xe ben trai chay CUNG chieu ro rang (duong 1 chieu nhieu lan).
let inOpp = false, sameAt = -99, inOppAt = -99;

// ---- xe low-poly ----
function profileShape(pts) { const s = new THREE.Shape(); pts.forEach((p, i) => i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1])); s.closePath(); return s; }
function extrudeSide(pts, width, mat, bevel = 0.06) {
  const g = new THREE.ExtrudeGeometry(profileShape(pts), { depth: width - bevel * 2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 4 });
  g.translate(0, 0, -(width - bevel * 2) / 2); const m = new THREE.Mesh(g, mat); m.rotation.y = Math.PI / 2; return m;
}
const MATS = {
  ego: new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.2 }),
  glass: new THREE.MeshStandardMaterial({ roughness: 0.15, metalness: 0.4 }),
  tire: new THREE.MeshStandardMaterial({ color: 0x111317, roughness: 0.9 }),
};
function wheels(grp, W, r, axles) { const g = new THREE.CylinderGeometry(r, r, 0.26, 16); g.rotateZ(Math.PI / 2);
  axles.forEach(z => [-1, 1].forEach(s => { const w = new THREE.Mesh(g, MATS.tire); w.position.set(s * (W / 2 - 0.1), r, z); grp.add(w); })); }
function addShadow(grp, L, W) { const m = new THREE.Mesh(new THREE.PlaneGeometry(W * 1.35, L * 1.25), new THREE.MeshBasicMaterial({ color: 0, transparent: true, alphaMap: shadowTex, opacity: 0.5, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.015; grp.add(m); grp.userData.shadow = m; }
function makeCar(kind, bodyMat) {
  const grp = new THREE.Group(); let L, W;
  if (kind === 'car' || kind === 'ego') {
    L = 4.6; W = 1.86;
    const b = extrudeSide([[0, 0.32], [0, 0.92], [0.35, 1.0], [3.5, 1.0], [4.35, 0.84], [4.6, 0.62], [4.6, 0.32]], W, bodyMat);
    const c = extrudeSide([[0.55, 0.98], [1.15, 1.42], [2.85, 1.45], [3.55, 0.98]], W - 0.16, MATS.glass, 0.05);
    const roof = extrudeSide([[1.2, 1.40], [2.8, 1.43], [2.8, 1.48], [1.25, 1.46]], W - 0.3, bodyMat, 0.04);
    [b, c, roof].forEach(m => { m.position.z = L / 2; grp.add(m); });
    wheels(grp, W, 0.34, [L / 2 - 0.85, -L / 2 + 0.9]);
    if (kind === 'ego') { const tl = new THREE.Mesh(new THREE.BoxGeometry(W - 0.25, 0.06, 0.02), new THREE.MeshBasicMaterial({ color: 0xff4a4a })); tl.position.set(0, 0.86, L / 2 + 0.07); grp.add(tl); }
  } else if (kind === 'big') {
    L = 9.5; W = 2.45;
    const cab = new THREE.Mesh(new THREE.BoxGeometry(W, 2.6, 2.1), bodyMat); cab.position.set(0, 1.75, -L / 2 + 1.05); grp.add(cab);
    const ws = new THREE.Mesh(new THREE.BoxGeometry(W - 0.2, 0.9, 0.05), MATS.glass); ws.position.set(0, 2.3, -L / 2 - 0.01); grp.add(ws);
    const box = new THREE.Mesh(new THREE.BoxGeometry(W, 3.0, L - 2.4), bodyMat); box.position.set(0, 1.95, 1.2); grp.add(box);
    wheels(grp, W, 0.5, [-L / 2 + 1.2, L / 2 - 2.4, L / 2 - 1.2]);
  } else if (kind === 'moto') {
    L = 1.9; W = 0.7;
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.5, 1.6), bodyMat); b.position.y = 0.6; grp.add(b);
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 0.75, 10), bodyMat); t.position.set(0, 1.25, 0.15); grp.add(t);
    const hd = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), MATS.glass); hd.position.set(0, 1.78, 0.1); grp.add(hd);
    const wg = new THREE.CylinderGeometry(0.3, 0.3, 0.12, 14); wg.rotateZ(Math.PI / 2);
    [-0.68, 0.68].forEach(z => { const w = new THREE.Mesh(wg, MATS.tire); w.position.set(0, 0.3, z); grp.add(w); });
  } else {
    L = 0.6; W = 0.6;
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.18, 1.2, 10), bodyMat); t.position.y = 0.9; grp.add(t);
    const hd = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 10), bodyMat); hd.position.y = 1.65; grp.add(hd);
  }
  addShadow(grp, L, W); grp.userData.L = L; return grp;
}
const ego = makeCar('ego', MATS.ego); ego.position.set(0, 0, 0.5); scene.add(ego);   // goc toa do = camera kinh lai, dau xe ~1,8 m phia truoc
const glow = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 6.4), new THREE.MeshBasicMaterial({ color: 0x3e8bff, transparent: true, alphaMap: shadowTex, opacity: 0.9, depthWrite: false }));
glow.rotation.x = -Math.PI / 2; glow.position.y = 0.03; glow.visible = false; scene.add(glow);
const KIND = { car: 'car', bus: 'big', truck: 'big', moto: 'moto', bike: 'moto', person: 'person' };
const GRP = { car: 'v', bus: 'v', truck: 'v', moto: 'm', bike: 'm', person: 'p' };
const WID = { car: 1.86, big: 2.45, moto: 0.75, person: 0.6 };
let oncAt = -99;   // lan cuoi thay xe chay nguoc chieu ben trai -> duong 2 chieu, ve vach tim vang

function applyTheme(t) {
  theme = t; const T = THEMES[t];
  scene.background = new THREE.Color(T.bg); scene.fog = new THREE.Fog(T.bg, T.fog[0], T.fog[1]);
  ground.material.color.setHex(T.ground); road.material.color.setHex(T.road);
  shoulderL.material.color.setHex(T.edge); shoulderR.material.color.setHex(T.edge);
  lines.forEach(l => l.material.color.setHex(T.line)); [wallL, wallR, wallO].forEach(w => w.material.color.setHex(T.wall));
  oppRoad.material.color.setHex(T.opp); oppEdge.material.color.setHex(T.edge); oppLine.material.color.setHex(T.line);
  yelA.material.color.setHex(T.yel); yelB.material.color.setHex(T.yel); walkR.material.color.setHex(T.walk); walkL.material.color.setHex(T.walk);
  hemi.color.setHex(T.hemi[0]); hemi.groundColor.setHex(T.hemi[1]); hemi.intensity = T.hemi[2]; sun.intensity = T.sun;
  MATS.ego.color.setHex(T.ego); MATS.glass.color.setHex(T.glass);
  ego.userData.shadow.material.opacity = T.shadow;
  document.body.className = t;
}
// goc nhin: sau xe / tren cao / FSD (thap, sat sau xe, rong nhu man Tesla FSD)
const VIEWS = { chase: 'Sau xe', high: 'Trên cao', low: 'Sát sau', fsd: 'FSD' }, VORDER = ['chase', 'high', 'low', 'fsd'];
let curView = 'chase';
// camera quay quanh 1 diem phia truoc xe: az (do, + = camera lech sang phai-sau), el (do cao), r (m). Keo 1 ngon = xoay, 2 ngon = zoom, cham 2 lan = ve goc goc.
// FSD (23/11): nhin xeo 3/4 tu sau-trai (thay ro phan duong nguoc chieu), cao, rong nhu man Tesla FSD / GTA thay vi dung sau duoi xe.
const PRESET = { chase: { fz: 22, fy: 0.8, az: 0, el: 7, r: 35.8, fov: 46 },
                 high:  { fz: 24, fy: 0, az: 0, el: 31, r: 42, fov: 50 },
                 low:   { fz: 30, fy: 1.0, az: 0, el: 3, r: 37.7, fov: 58 },   // goc thap sat sau xe (ban 0.1.117)
                 fsd:   { fz: 9, fy: 0.6, az: -15, el: 23, r: 28, fov: 50 } };
const orb = { dAz: 0, dEl: 0, kR: 1 };
function placeCam() {
  const P = PRESET[curView], az = (P.az + orb.dAz) * Math.PI / 180, el = Math.max(3, Math.min(80, P.el + orb.dEl)) * Math.PI / 180, r = P.r * orb.kR;
  cam.fov = P.fov;
  cam.position.set(-Math.sin(az) * Math.cos(el) * r, P.fy + Math.sin(el) * r, -P.fz + Math.cos(az) * Math.cos(el) * r);
  cam.lookAt(0, P.fy, -P.fz); cam.updateProjectionMatrix();
}
function setView(v) {
  if (!VIEWS[v]) v = 'chase'; curView = v; orb.dAz = 0; orb.dEl = 0; orb.kR = 1;
  placeCam();
  document.getElementById('vbtn').textContent = '🎥 ' + VIEWS[v];
}
(() => {
  const pts = new Map(); let lastTap = 0, pinch0 = 0, k0 = 1;
  const el = renderer.domElement; el.style.touchAction = 'none';
  el.addEventListener('pointerdown', e => { pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); k0 = orb.kR; }
    if (pts.size === 1) { const t = performance.now(); if (t - lastTap < 300) { orb.dAz = 0; orb.dEl = 0; orb.kR = 1; placeCam(); } lastTap = t; } });
  el.addEventListener('pointermove', e => { const p = pts.get(e.pointerId); if (!p) return;
    if (pts.size === 1) { orb.dAz -= (e.clientX - p[0]) * 180 / innerWidth; orb.dEl += (e.clientY - p[1]) * 90 / innerHeight;
      orb.dAz = Math.max(-170, Math.min(170, orb.dAz)); }
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2 && pinch0 > 0) { const [a, b] = [...pts.values()]; orb.kR = Math.max(0.35, Math.min(2.2, k0 * pinch0 / Math.max(20, Math.hypot(a[0] - b[0], a[1] - b[1])))); }
    placeCam(); });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = 0; };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
})();
document.getElementById('vbtn').addEventListener('click', () => {
  const v = VORDER[(VORDER.indexOf(curView) + 1) % VORDER.length]; setView(v);
  try { window.LaneApp && window.LaneApp.setView(v); } catch (e) {}
});
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize);

// ---- trang thai: dich (tu AI) va hien (lam muot) ----
let tgt = null;                 // goi moi nhat tu Kotlin
const cur = { ln: null, lp: [0, 0, 0, 0], ed: null, py: null, px: null, v: 0 };
let odo = 0, lastFeedAt = -1, simNow = 0;
const tracks = []; let nextId = 1;
const now = () => window.SIM ? simNow : performance.now() / 1000;
const interp = (xs, ys, x) => { if (x <= xs[0]) { const s = (ys[1] - ys[0]) / (xs[1] - xs[0]); return ys[0] + s * (x - xs[0]); }
  for (let i = 1; i < xs.length; i++) if (x <= xs[i]) { const t = (x - xs[i - 1]) / (xs[i] - xs[i - 1]); return ys[i - 1] + t * (ys[i] - ys[i - 1]); } return ys[ys.length - 1]; };

/** Kotlin goi moi lan AI chay. ob: [[loai, x truoc m, y phai m, laXeTruoc]] */
window.feed = function (j) {
  const d = typeof j === 'string' ? JSON.parse(j) : j;
  if (d.th && d.th !== theme) applyTheme(d.th);
  if (d.view) setView(d.view);
  tgt = d; const t = now(); const dt = lastFeedAt < 0 ? 0.1 : Math.min(0.5, Math.max(0.02, t - lastFeedAt)); lastFeedAt = t;
  document.getElementById('wait').hidden = true;
  // nguoi dung TREN LONG DUONG (ke ca phan nguoc chieu) = nguoi lai xe may ma YOLO khong bat duoc xe -> ve xe may
  if (cur.ed && d.ob) for (const o of d.ob) if (o[0] === 'person' && o[1] > 2) {
    const eL = interp(X_IDX, cur.ed[0], o[1]), eR = interp(X_IDX, cur.ed[1], o[1]);
    if (o[2] > eL - 0.3 - oppW && o[2] < eR - 0.2) o[0] = 'moto';
  }
  // gan detections vao vet (gan nhat, cung nhom), uoc van toc tuong doi
  const used = new Set();
  for (const tr of tracks) {
    const px = tr.x + tr.vx * (t - tr.t), py = tr.y + tr.vy * (t - tr.t);
    let bi = -1, bd = 1;
    (d.ob || []).forEach((o, i) => { if (used.has(i) || GRP[o[0]] !== tr.g) return;
      const dd = ((o[1] - px) / (0.15 * Math.abs(px) + 3)) ** 2 + ((o[2] - py) / 1.6) ** 2; if (dd < bd) { bd = dd; bi = i; } });
    if (bi >= 0) { const o = d.ob[bi]; used.add(bi);
      // van toc tuong doi: hoi quy tuyen tinh tren ~1,5 s lich su (YOLO 4 lan/giay, xe xa nhay vi tri -> sai phep tru 2 diem)
      (tr.h = tr.h || []).push([t, o[1], o[2]]); while (tr.h.length > 2 && t - tr.h[0][0] > 1.5) tr.h.shift();
      const span = t - tr.h[0][0];
      if (span >= 0.6) {

        for (const q of tr.h) { const u = q[0] - t; st += u; sx += q[1]; sy += q[2]; stt += u * u; stx += u * q[1]; sty += u * q[2]; }
        const den = stt - st * st / m;

      tr.vx = Math.max(-25, Math.min(25, tr.vx)); tr.vy = Math.max(-4, Math.min(4, tr.vy));
      // xe chay NGUOC CHIEU: lai gan nhanh hon toc do minh > 3 m/s (dung yen thi chi lai gan dung bang toc do minh). Chi tin khi xe < 35 m
      if (span >= 0.6 && o[1] < 35) tr.onc = Math.max(-5, Math.min(5, (tr.onc || 0) + (tr.vx < -(cur.v + 3) ? 1 : tr.vx > -(cur.v * 0.4) ? -1 : 0)));
      tr.x = o[1]; tr.y = o[2]; tr.t = t; tr.n++; tr.lead = o[3] ? 1 : 0; tr.cls[o[0]] = (tr.cls[o[0]] || 0) + 1; tr.miss = 0;

  }

    tracks.push({ id: nextId++, g: GRP[o[0]] || 'v', cls: { [o[0]]: 1 }, x: o[1], y: o[2], vx: 0, vy: 0, t, n: 1, miss: 0, lead: o[3] ? 1 : 0, sx: o[1], sy: o[2], a: 0, born: t }); });

};

function ema(curArr, tgtArr, a) { if (!curArr || curArr.length !== tgtArr.length) return tgtArr.slice(); for (let i = 0; i < tgtArr.length; i++) curArr[i] += (tgtArr[i] - curArr[i]) * a; return curArr; }

/** Ve 1 khung, dt giay tu khung truoc. */
function step(dt) {
  if (window.SIM) simNow += dt;
  if (!tgt) { renderer.render(scene, cam); return; }
  const T = THEMES[theme], d = tgt, a = 1 - Math.exp(-dt / 0.12), t = now();
  cur.v += ((d.v || 0) - cur.v) * a;
  cur.ln = (cur.ln || [0, 1, 2, 3].map(() => null)).map((c, k) => ema(c, d.ln[k], a));
  cur.lp = ema(cur.lp, d.lp, 1 - Math.exp(-dt / 0.3));
  cur.ed = (cur.ed || [null, null]).map((c, k) => ema(c, d.ed[k], 1 - Math.exp(-dt / 0.25)));
  if (d.pl) { cur.px = d.pl.map(p => p[0]); cur.py = ema(cur.py, d.pl.map(p => p[1]), a); }
  odo += Math.max(0, cur.v) * dt;
  const at = (arr, x) => interp(X_IDX, arr, Math.max(0, x)), sample = arr => XS.map(x => at(arr, x));
  const eL = sample(cur.ed[0]), eR = sample(cur.ed[1]);
  setRibbon(road, eL.map(v => v - 0.3), eR.map(v => v + 0.3));
  setRibbon(shoulderL, eL.map(v => v - 0.3), eL.map(v => v - 0.12));
  setRibbon(shoulderR, eR.map(v => v + 0.12), eR.map(v => v + 0.3));
  // phan duong nguoc chieu / le phai: lon dan khi thay xe ngoai mep, giu 8 s roi thu lai
  const oT = t - oppAt < 8 && !inOpp ? Math.max(6.5, Math.min(11, oppMax)) : 0, pT = t - parkAt < 8 ? Math.max(3, Math.min(7.5, parkMax)) : 0;
  const ga = 1 - Math.exp(-dt / 0.6); oppW += (oT - oppW) * ga; parkW += (pT - parkW) * ga;
  if (t - oppAt > 8) oppMax = 0; if (t - parkAt > 8) parkMax = 0;
  const gapL = at(cur.ln[1], 10) - at(cur.ed[0], 10);
  // co tre: xe to che mep duong lam mep trai nhay vao trong -> giu che do 2 lan them 4 s
  if (gapL > 2.5 && cur.lp[1] > 0.25) inOppAt = t;
  inOpp = cur.v * 3.6 < 60 && t - sameAt > 10 && (t - inOppAt < 0.5 || (inOpp && t - inOppAt < 4));
  const two = oppW > 0.4 && !inOpp;
  [oppRoad, oppEdge, yelA, yelB, wallO, walkL].forEach(m => m.visible = two);
  oppLine.visible = oppW > 5.5;
  if (two) {
    const iL = eL.map(v => v - 0.3), oL = iL.map(v => v - oppW);
    setRibbon(oppRoad, oL, iL);
    setRibbon(yelA, iL.map(v => v - 0.08), iL.map(v => v + 0.02)); setRibbon(yelB, iL.map(v => v + 0.14), iL.map(v => v + 0.24));
    setRibbon(oppLine, iL.map(v => v - oppW / 2 - 0.075), iL.map(v => v - oppW / 2 + 0.075), odo);
    setRibbon(oppEdge, oL.map(v => v - 0.18), oL);
    setRibbon(walkL, oL.map(v => v - 3.2), oL.map(v => v - 0.18));
    setWall(wallO, oL.map(v => v - 3.3), 0.7);
  }
  // duong 2 lan: xe ngoai mep trai = xe do / le trai
  walkL.visible = two || (inOpp && t - oppAt < 8);
  if (inOpp && walkL.visible) setRibbon(walkL, eL.map(v => v - 4.5), eL.map(v => v - 0.3));
  walkR.visible = parkW > 0.4;
  if (walkR.visible) setRibbon(walkR, eR.map(v => v + 0.3), eR.map(v => v + 0.3 + parkW));
  // khi da co phan duong ben kia / le do xe thi bo tuong mo (truoc day xe ben kia dung sau tuong)
  // cao toc (> 60 km/h): ben kia la chieu doc lap co dai phan cach -> giu tuong, khong ve vach vang
  const hw = cur.v * 3.6 > 60; yelA.visible = yelB.visible = two && !hw;
  wallL.visible = !two || hw; wallR.visible = true;
  setWall(wallL, eL.map(v => v - 0.45), 0.7); setWall(wallR, eR.map(v => v + 0.45 + parkW), 0.7);
  for (let k = 0; k < 4; k++) {
    const ln = cur.ln[k], Y = sample(ln), y10 = at(ln, 10), e0 = at(cur.ed[0], 10), e1 = at(cur.ed[1], 10);
    const dE = Math.min(Math.abs(y10 - e0), Math.abs(y10 - e1));
    const inside = y10 > e0 - 0.4 && y10 < e1 + 0.4;
    lines[k].visible = cur.lp[k] > (k === 1 || k === 2 ? 0.25 : 0.4) && inside;
    // duong 2 lan: vach 0 (ngoai lan nguoc chieu) chi la vach le -> ve lien, khong ve them 1 lan
    const shoulder = inOpp && k === 0;
    // duong 2 chieu (thay xe nguoc chieu ben trai trong 5 s): vach trai lan minh = vach tim vang lien
    const center = k === 1 && ((t - oncAt < 5 && !two) || inOpp);
    lines[k].material.color.setHex(center ? (theme === 'night' ? 0xffc21a : 0xe2a400) : T.line);
    const solid = dE < 0.9 || center || shoulder; if ((lines[k].material.alphaMap === null) !== solid) { lines[k].material.alphaMap = solid ? null : dashTex; lines[k].material.needsUpdate = true; }
    lines[k].material.opacity = Math.min(1, 0.35 + cur.lp[k]);
    const w = (k === 1 || k === 2) ? 0.09 : 0.075;
    setRibbon(lines[k], Y.map(v => v - w), Y.map(v => v + w), odo);
  }
  const vk = Math.max(0, cur.v * 3.6);
  // duong di: dung o duoi xe truoc
  path.visible = !!cur.py;
  if (cur.py) {
    let pmax = Math.max(12, Math.min(60, cur.px[cur.px.length - 1]));
    if (d.ld && d.ld.p > 0.5) pmax = Math.max(4, Math.min(pmax, d.ld.x + 0.5));
    const PY = XS.map(x => interp(cur.px, cur.py, Math.min(Math.max(x, 0), pmax)));
    const pw = j => (XS[j] < 1.9 || XS[j] > pmax) ? 0 : 0.95;
    setRibbon(path, PY.map((v, j) => v - pw(j)), PY.map((v, j) => v + pw(j)), 0, x => Math.max(0, Math.min(1, (x - 1.9) / (pmax - 1.9))));
  }
  // xe
  const centerAt = x => (at(cur.ln[1], x) + at(cur.ln[2], x)) / 2;
  let leadInfo = null; glow.visible = false;
  const placed = [];   // chan cac xe chong len nhau (xe may xep hang 2 ben truoc day bi ve thanh 1 cuc)
  tracks.sort((p, q) => p.sx - q.sx);
  for (const tr of tracks) {
    if (tr.n < 2 && t - tr.born < 0.25) continue;            // 1 lan nhan thoang qua: chua ve
    const tx = tr.x + tr.vx * Math.min(0.6, t - tr.t), ty = tr.y + tr.vy * Math.min(0.6, t - tr.t);
    tr.sx += (tx - tr.sx) * a; tr.sy += (ty - tr.sy) * a;
    tr.a = Math.min(1, tr.a + dt / 0.3);
    const fadeOut = Math.max(0, 1 - Math.max(0, t - tr.t - 0.4) / 0.6);
    const c = Object.keys(tr.cls).reduce((p, q) => tr.cls[p] >= tr.cls[q] ? p : q);
    if (!tr.obj || tr.obj.kind !== KIND[c]) {
      if (tr.obj) scene.remove(tr.obj.grp);
      const mat = new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0.15, transparent: true });
      tr.obj = { grp: makeCar(KIND[c] || 'car', mat), mat, kind: KIND[c] }; scene.add(tr.obj.grp);
    }
    const ob = tr.obj, L = ob.grp.userData.L, y = tr.sy, Wd = WID[ob.kind] || 1.8;
    let x = tr.sx;
    for (let it = 0; it < 6; it++) {
      const hit = placed.find(p => Math.abs(p.y - y) < (p.w + Wd) / 2 * 0.9 && x < p.x + p.l + 0.4 && x + L > p.x - 0.4);
      if (!hit) break; x = hit.x + hit.l + 0.6;
    }
    placed.push({ x, y, l: L, w: Wd });
    const xc = x + (ob.kind === 'person' ? 0 : L / 2);
    ob.grp.position.set(y, 0, -xc);
    if ((tr.onc || 0) >= 3 && y < centerAt(xc)) oncAt = t;
    // xe nam ngoai mep trai (khong phai nguoi di bo) -> co phan duong nguoc chieu; ngoai mep phai -> le / xe do

    const outL = y < eLx - 0.6, outR = y > eRx + 0.6;
    if (tr.n >= 3 && ob.kind !== 'person' && x > 3 && x < 60) {
      if (outL && eLx - y < 14) { oppAt = t; if (!inOpp) oppMax = Math.max(oppMax, eLx - 0.3 - y + 2.2); }
      if (outR && y - eRx < 10) { parkAt = t; parkMax = Math.max(parkMax, y - eRx - 0.3 + 1.6); }
    }
    // ben phan nguoc chieu: mac dinh quay dau ve phia minh, tru khi vet cho thay chay cung chieu ro rang
    const l1x = at(cur.ln[1], xc);
    if (ob.kind !== 'person' && tr.n > 10 && cur.v > 4 && x > 4 && x < 30 && y < l1x - 0.3 && y > eLx - 0.3 && (tr.onc || 0) <= -4 && tr.vx > -cur.v * 0.3) sameAt = t;
    const withUs = (tr.onc || 0) <= -3 && cur.v > 3 && tr.vx > -cur.v * 0.4;    // dang chay cung chieu ro rang
    const faceUs = (tr.onc || 0) >= 3 || (!withUs && ((two && y < eLx - 0.2) || (inOpp && y < l1x - 0.2 && y > eLx - 0.6)));
    const yaw = Math.atan2(centerAt(xc + 3) - centerAt(xc - 3), 6); ob.grp.rotation.y = -yaw + (faceUs ? Math.PI : 0);
    const fade = Math.min(tr.a, fadeOut, x > 70 ? Math.max(0, (95 - x) / 25) : 1);
    let col = faceUs && ob.kind !== 'person' ? T.onc : T.car;
    if (tr.lead && d.ld) {
      col = T.lead; const vrel = d.ld.v - cur.v, ttc = vrel < -0.5 ? x / -vrel : 99;
      if (vk > 5 && x < ttSafe(vk)) col = 0xffb020;
      if (vk > 10 && ttc < 2.5) col = 0xff3b3b;
      leadInfo = { x, col };
      glow.visible = true; glow.position.set(y, 0.03, -xc); glow.rotation.z = yaw;
      glow.material.color.setHex(col === T.lead ? 0x3e8bff : col); glow.material.opacity = 0.95 * fade;
    }
    ob.mat.color.setHex(col); ob.mat.opacity = fade; ob.mat.depthWrite = fade > 0.95;

  if (leadInfo) chips.push(`<span class="chip ${leadInfo.col === 0xff3b3b ? 'dang' : leadInfo.col === 0xffb020 ? 'warn' : 'lead'}">Xe trước ${Math.round(leadInfo.x)} m</span>`);
  if (d.ldw === 'L' || d.ldw === 'R') chips.push(`<span class="chip dang">Lệch lane ${d.ldw === 'L' ? 'trái' : 'phải'}</span>`);
  else if (d.off != null) chips.push(`<span class="chip">Lệch lane ${d.off >= 0 ? '+' : ''}${d.off} cm</span>`);

window.step = step;

applyTheme('night'); setView('chase'); resize();
if (!window.SIM) { let last = performance.now(); const loop = (ts) => { const dt = Math.min(0.1, (ts - last) / 1000); last = ts; step(dt); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
</script>
