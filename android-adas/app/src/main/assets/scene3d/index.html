<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Cảnh 3D LANE</title>
<style>
/* Man canh lai 3D cua app LANE: Kotlin goi feed(json) moi lan AI chay (5–20 lan/giay), trang tu noi suy 60 khung/giay */
@font-face { font-family: BVP; src: url("../fonts/BeVietnamPro-Bold.ttf"); font-weight: 700; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #15181d; font-family: BVP, "Roboto", sans-serif; }
canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
.hud { position: absolute; left: 3.5vw; top: 4vh; display: flex; flex-direction: column; gap: 0.4vh; pointer-events: none; color: var(--ink); }
body.night { --ink: #f4f6f9; --sub: #c9d0da; --chip: rgba(255,255,255,.12); background: #15181d; }
body.day { --ink: #16191e; --sub: #3d4550; --chip: rgba(0,0,0,.08); background: #e4e7eb; }
.spd { font-weight: 800; font-size: 13vh; line-height: .95; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.unit { font-weight: 700; font-size: 2.8vh; color: var(--sub); }
.chips { display: flex; flex-wrap: wrap; gap: 1vh; margin-top: 1.4vh; max-width: 60vw; }
.chip { font-weight: 700; font-size: 2.5vh; padding: .6vh 1.6vh; border-radius: 99px; background: var(--chip); font-variant-numeric: tabular-nums; }
.chip.lead { background: #2f7bff; color: #fff; }
.chip.warn { background: #ffb020; color: #1a1300; }
.chip.dang { background: #ff3b3b; color: #fff; }
.vbtn { position: absolute; right: 2.5vw; bottom: 4vh; font-weight: 700; font-size: 2.6vh; padding: 1.2vh 2.2vh; border-radius: 99px;
  background: var(--chip); color: var(--ink); border: 0; -webkit-tap-highlight-color: transparent; backdrop-filter: blur(6px); }
.vbtn:active { transform: scale(.95); }
.tl { position: absolute; left: 50%; top: 2.2vh; transform: translateX(-50%); display: none; align-items: center; gap: 1.6vh;
  padding: 1.2vh 2.2vh; border-radius: 2.4vh; background: rgba(10,12,16,.86); color: #fff; font-weight: 700; }
.tl .dots { display: flex; flex-direction: column; gap: .6vh; }
.tl .dot { width: 2.4vh; height: 2.4vh; border-radius: 50%; background: #373a40; }
.tl .lb { font-size: 2.6vh; line-height: 1.1; } .tl .lb small { display: block; font-size: 1.9vh; color: #c8c8cd; font-weight: 600; }
.tl .sec { font-size: 7vh; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1ch; text-align: right; }
/* 23/11 toi: bien toc do canh so km/h + bien vua qua + camera phat nguoi (giong man camera) */
.row1 { display: flex; align-items: center; gap: 2.2vh; }
.lim { position: relative; width: 11vh; height: 11vh; display: none; flex: none; }
.lim img { position: absolute; inset: 0; width: 100%; height: 100%; }
.lim b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 5.4vh; color: #000; font-weight: 800; letter-spacing: -.03em; }
.lim small { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: .4vh; font-size: 1.8vh; font-weight: 700; color: var(--sub); white-space: nowrap; }
.lim.ov { animation: ovp .8s infinite alternate; } .lim.ov small { color: #ff3b3b; }
@keyframes ovp { from { transform: scale(1); } to { transform: scale(1.1); } }
.spd.ov { color: #ff3b3b; }
.sgs { display: flex; flex-direction: column; gap: 1.2vh; margin-top: 3vh; }
.sg { display: flex; align-items: center; gap: 1.4vh; font-size: 2.4vh; font-weight: 700; }
.sg .ic { position: relative; width: 7vh; height: 7vh; flex: none; } .sg .ic img { width: 100%; height: 100%; }
.sg .ic b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3.4vh; color: #000; font-weight: 800; }
.cam { display: flex; align-items: center; gap: 1.2vh; padding: .8vh 1.8vh .8vh .8vh; border-radius: 99px; background: rgba(255,138,61,.16); font-weight: 700; font-size: 2.4vh; }
.cam i { width: 4.6vh; height: 4.6vh; border-radius: 50%; background: #ff8a3d; color: #141414; font-style: normal; font-size: 1.5vh; display: flex; align-items: center; justify-content: center; }
.cam b { color: #ff8a3d; font-size: 3vh; }
.wait { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); font-weight: 700; font-size: 3vh; color: var(--sub); }
</style>
</head>
<body class="night">
<div class="hud"><div class="row1"><div><div class="spd" id="spd">0</div><div class="unit">km/h</div></div><div class="lim" id="lim"><img src="../bien/17.png" alt=""><b id="limN"></b><small id="limS"></small></div></div><div class="chips" id="chips"></div><div class="sgs" id="sgs"></div></div>
<button class="vbtn" id="vbtn">🎥 Sau xe</button>
<div class="tl" id="tl"><div class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="lb" id="tlLb"></div><div class="sec" id="tlSec"></div></div>
<div class="wait" id="wait">Đang chờ AI…</div>
<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
"use strict";
const N = 33, X_IDX = []; for (let i = 0; i < N; i++) X_IDX.push(192 * (i / 32) * (i / 32));
const THEMES = {
  night: { bg: 0x15181d, fog: [30, 140], ground: 0x1b1f25, road: 0x2b3038, line: 0xdfe4ea, edge: 0x6d7682, wall: 0x3a414b,
           car: 0x8d96a1, ego: 0xf2f4f6, glass: 0x1a1f26, lead: 0xdde6f3, shadow: 0.55, hemi: [0xcfd8e6, 0x15181d, 0.75], sun: 0.85,
           opp: 0x262b33, walk: 0x343a43, shd: 0x3d434d, tree: [0x2f5d3c, 0x3a6b45, 0x284f33], trunk: 0x4a3b2c, house: [0x3a414b, 0x434b56, 0x353c45, 0x4b535e], yel: 0xffc21a, onc: 0xa39a8c, park: 0x5f6772, med: 0x2f4a34 },
  day:   { bg: 0xe4e7eb, fog: [30, 150], ground: 0xd9dce1, road: 0xbfc4cb, line: 0xffffff, edge: 0x8d949d, wall: 0xa9afb7,
           car: 0x7b838d, ego: 0xffffff, glass: 0x2a313a, lead: 0x4b5566, shadow: 0.28, hemi: [0xffffff, 0xb9bec5, 0.85], sun: 0.75,
           opp: 0xb3b8c0, walk: 0xcdd1d6, shd: 0xd5d8dd, tree: [0x7fb27a, 0x6fa86b, 0x8cbf86], trunk: 0x7a6450, house: [0xeef0f3, 0xe3e7ec, 0xf4f5f7, 0xd9dee5], yel: 0xe2a400, onc: 0x8a8173, park: 0x9aa1aa, med: 0x8fb08f },
};
let theme = 'night';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: !!window.SIM });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(46, 16 / 9, 0.1, 400);
const hemi = new THREE.HemisphereLight(0xffffff, 0x222222, 0.8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(-6, 14, 8); scene.add(sun);

// ---- dai bang tren mat duong ----
const XS = []; for (let i = 0; i <= 70; i++) XS.push(i <= 30 ? -8 + i : 22 + (i - 30) * 1.6);
function ribbon(color, opacity, h, uvLen) {
  const g = new THREE.BufferGeometry(), n = XS.length;
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 6), 3));
  g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(n * 4), 2));
  const idx = []; for (let i = 0; i < n - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  g.setIndex(idx);
  const m = new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: opacity >= 1, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(g, m); mesh.userData = { h, uvLen }; mesh.frustumCulled = false; scene.add(mesh); return mesh;
}
function setRibbon(mesh, L, R, odo, vfun) {
  const p = mesh.geometry.attributes.position.array, uv = mesh.geometry.attributes.uv.array, h = mesh.userData.h;
  for (let i = 0; i < XS.length; i++) {
    p[i * 6] = L[i]; p[i * 6 + 1] = h; p[i * 6 + 2] = -XS[i];
    p[i * 6 + 3] = R[i]; p[i * 6 + 4] = h; p[i * 6 + 5] = -XS[i];
    const v = vfun ? vfun(XS[i]) : mesh.userData.uvLen ? (XS[i] + (odo || 0)) / mesh.userData.uvLen : 0;
    uv[i * 4] = 0; uv[i * 4 + 1] = v; uv[i * 4 + 2] = 1; uv[i * 4 + 3] = v;
  }
  mesh.geometry.attributes.position.needsUpdate = true; mesh.geometry.attributes.uv.needsUpdate = true;
}
function wallMesh() {
  const g = new THREE.BufferGeometry(), n = XS.length;
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 6), 3));
  const idx = []; for (let i = 0; i < n - 1; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); } g.setIndex(idx);
  const mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x444444, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false }));
  mesh.frustumCulled = false; scene.add(mesh); return mesh;
}
function setWall(mesh, Y, hgt, side) {
  const p = mesh.geometry.attributes.position.array;
  for (let i = 0; i < XS.length; i++) { const cut = (jOn && Math.abs(XS[i] - crossX) < jW / 2 + 12) || (side && brs.some(b => (b.side === side || b.side === 2) && Math.abs(XS[i] - b.x) < 5));   // giao lo / loi re: khong co tuong
    p[i * 6] = Y[i]; p[i * 6 + 1] = 0; p[i * 6 + 2] = -XS[i]; p[i * 6 + 3] = Y[i]; p[i * 6 + 4] = cut ? 0 : hgt; p[i * 6 + 5] = -XS[i]; }
  mesh.geometry.attributes.position.needsUpdate = true;
}
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return new THREE.CanvasTexture(c); }
const dashTex = canvasTex(4, 64, (x, w, h) => { x.fillStyle = '#000'; x.fillRect(0, 0, w, h); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h * 0.38); });
dashTex.wrapT = THREE.RepeatWrapping;
const pathTex = canvasTex(64, 256, (x, w, h) => { const g = x.createLinearGradient(0, h, 0, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.1, 'rgba(255,255,255,.95)'); g.addColorStop(0.55, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, w, h); const s = x.createLinearGradient(0, 0, w, 0); s.addColorStop(0, 'rgba(0,0,0,1)'); s.addColorStop(.18, 'rgba(0,0,0,0)'); s.addColorStop(.82, 'rgba(0,0,0,0)'); s.addColorStop(1, 'rgba(0,0,0,1)');
  x.globalCompositeOperation = 'destination-out'; x.fillStyle = s; x.fillRect(0, 0, w, h); });
const shadowTex = canvasTex(64, 128, (x, w, h) => { const g = x.createRadialGradient(w / 2, h / 2, 4, w / 2, h / 2, w / 2);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.save(); x.scale(1, 2); x.fillStyle = g; x.fillRect(0, 0, w, h / 2); x.restore(); });

const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshBasicMaterial({ color: 0x222222 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; scene.add(ground);
const road = ribbon(0x333333, 1, 0.0);
// 23/11: giao lo - thay xe chay NGANG phia truoc -> ve duong cat ngang + vach dung
// Giao lo (nhom dat tai z = -crossX): mat duong ngang phu len vach doc, mep + tim duong ngang (chi ngoai long duong minh),
// vach di bo 2 phia, vach dung truoc vach di bo; tuong/le duong doc bi cat trong giao lo
const junc = new THREE.Group(); junc.visible = false; scene.add(junc);
const zebraTex = canvasTex(64, 8, (x, w, h) => { x.clearRect(0, 0, w, h); x.fillStyle = '#fff'; x.fillRect(0, 0, w * 0.5, h); }); zebraTex.wrapS = THREE.RepeatWrapping;
function flat(color, h, tex) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color, map: tex || null, transparent: !!tex, depthWrite: !tex }));
  m.rotation.x = -Math.PI / 2; m.position.y = h; m.userData.h = h; junc.add(m); return m;
}
function put(m, y0, y1, x0, x1) { m.scale.set(Math.max(0.01, y1 - y0), Math.max(0.01, x1 - x0), 1); m.position.set((y0 + y1) / 2, m.userData.h, -(x0 + x1) / 2); m.visible = y1 - y0 > 0.05; }
const jAsph = flat(0x333333, 0.017);
const jEdge = [0, 1, 2, 3].map(() => flat(0xffffff, 0.019)), jCen = [0, 1].map(() => flat(0xffc21a, 0.019));
const jZeb = [0, 1].map(() => flat(0xffffff, 0.019, zebraTex)), jStop = flat(0xffffff, 0.019);
// 23/11 toi: cot den giao thong 3D o vach dung (ben phai, can vuon ra long duong): den sang dung mau app doc duoc
const tlG = new THREE.Group(); scene.add(tlG); tlG.visible = false;
// 23/11 toi: duong nhanh theo ban do OSM (d.br): mat duong + 2 mep trang, tu mep duong minh ra ngoai 30 m, dung goc
let brs = [], brA = null;
const brG = [0, 1, 2, 3].map(() => { const g = new THREE.Group(); g.visible = false; scene.add(g);
  const mk = (c, w, h) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: c })); m.rotation.x = -Math.PI / 2; m.position.y = h; g.add(m); return m; };
  g.userData.a = mk(0x333333, 1, 0.026); g.userData.e1 = mk(0xffffff, 1, 0.03); g.userData.e2 = mk(0xffffff, 1, 0.03); return g; });
const tlLamp = [];
{ const gm = new THREE.MeshLambertMaterial({ color: 0x5a6068 }), bm = new THREE.MeshLambertMaterial({ color: 0x15181c });
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 5.4, 10), gm); pole.position.set(0, 2.7, 0); tlG.add(pole);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.12, 0.12), gm); arm.position.set(-1.7, 5.25, 0); tlG.add(arm);
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.4, 0.36), bm); box.position.set(-3.1, 4.55, 0); tlG.add(box);
  for (let i = 0; i < 3; i++) { const l = new THREE.Mesh(new THREE.SphereGeometry(0.17, 14, 10), new THREE.MeshBasicMaterial({ color: 0x2a2d31 }));
    l.position.set(-3.1, 5.0 - i * 0.45, 0.19); tlG.add(l); tlLamp.push(l); }
  const halo = new THREE.Mesh(new THREE.SphereGeometry(0.42, 14, 10), new THREE.MeshBasicMaterial({ color: 0xff3b30, transparent: true, opacity: 0.28, depthWrite: false }));
  tlG.add(halo); tlG.userData.halo = halo; }
let tlP = null, tlLastD = null, turnAt = -99, crossAt = -99, crossX = 15, oIdxPrev = null, inOppPrev = false, jOn = false, jW = 9, jEndAt = -99, tlJ = false, tlC = null;
const shoulderL = ribbon(0x777777, 1, 0.005), shoulderR = ribbon(0x777777, 1, 0.005);
// 23/11 (V14 Lite, sua 1 lan -> 3 lan): openpilot luon cho 4 vach. Duong 1 lan, vach ngoai (0/3) hay nam cach vach trong chi 1,5–2,3 m
// (vach le / mep nhua) voi xac suat 0,3–0,5 -> truoc day ve thanh them 1 lan. Nay vach ngoai chi la vach chia lan khi tin cay (> 0,55, giu > 0,4)
// va cach vach trong 2,5–4,8 m (dung be rong 1 lan), on dinh 0,5 s moi bat / 1 s moi tat. Le hep (< 2,8 m) ngoai vach cuoi to mau le, vach cuoi ve lien.
const shdL = ribbon(0x555555, 1, 0.003), shdR = ribbon(0x555555, 1, 0.003);
// 23/11 chan doan (bat "Ky thuat" trong Cai dat): ve vach THO tu goi moi nhat (do, chua lam muot) de so voi vach da ve (trang)
const rawL = [0, 1, 2, 3].map(() => { const m = ribbon(0xff2d2d, 1, 0.03); m.visible = false; return m; });
const acc = [false, true, true, false], accT = [0, 1, 1, 0]; let shLon = false, shRon = false;
const lines = [0, 1, 2, 3].map(() => { const m = ribbon(0xffffff, 1, 0.012, 12); m.material.alphaMap = dashTex; m.material.transparent = true; m.material.depthWrite = false; return m; });
const path = ribbon(0x3e8bff, 0.9, 0.02); path.material.alphaMap = pathTex; path.material.transparent = true; path.material.depthWrite = false;
const wallL = wallMesh(), wallR = wallMesh();
// 23/11 (3DLANE-02): duong 2 chieu - openpilot chi cho mep phan duong chieu minh, xe nguoc chieu / xe do ben kia truoc day nam lo lung ngoai duong.
// Thay xe ben ngoai mep trai -> ve them phan duong NGUOC CHIEU (mau hoi khac), vach tim vang doi o mep trai, vach dut giua phan ben kia.
// Thay xe do ngoai mep phai -> ve dai le/cho do xe.
const oppRoad = ribbon(0x333333, 1, 0.001), oppEdge = ribbon(0x777777, 1, 0.005);
const yelA = ribbon(0xffc21a, 1, 0.013), yelB = ribbon(0xffc21a, 1, 0.013);
const oppLine = ribbon(0xffffff, 1, 0.012, 12); oppLine.material.alphaMap = dashTex; oppLine.material.transparent = true; oppLine.material.depthWrite = false;
const walkR = ribbon(0x555555, 1, 0.004), walkL = ribbon(0x555555, 1, 0.004);
const wallO = wallMesh();
let oppW = 0, oppAt = -99, oppMax = 0, parkW = 0, parkAt = -99, parkMax = 0;
// 23/11 (video so sanh): duong 2 lan 2 chieu - openpilot coi lan nguoc chieu la 1 lan cua minh (mep trai = mep duong that).
// Con >= 2,5 m giua vach trai lan minh va mep trai -> do la lan NGUOC CHIEU: vach trai lan minh = tim vang, xe ben do quay dau.
// Chi bo khi thay xe ben trai chay CUNG chieu ro rang (duong 1 chieu nhieu lan).
let inOpp = false, sameAt = -99, inOppAt = -99;
// 23/11: doc kieu vach tu anh (d.lm, VehDet.marks): 0 khong ro, 1 trang dut, 2 trang lien, 3 vang dut, 4 vang lien, 5 vang doi.
// Vach vang ben trai = tim duong 2 chieu (cen = so thu tu vach do); khong co vang lau + co vach trang = duong 1 chieu nhieu lan.
// Phan cach cung (con luon): co xe nguoc chieu ben ngoai mep trai ma khong thay vach vang.
let cen = -1, yAt = -99, lmAt = -99;
const lines2 = [0, 1, 2, 3].map(() => { const m = ribbon(0xffffff, 1, 0.012, 12); m.material.alphaMap = dashTex; m.material.transparent = true; m.material.depthWrite = false; m.visible = false; return m; });
const med = ribbon(0x2f4a34, 1, 0.16), medWallA = wallMesh(), medWallB = wallMesh(); let medW = 0;

// ---- xe low-poly ----
function profileShape(pts) { const s = new THREE.Shape(); pts.forEach((p, i) => i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1])); s.closePath(); return s; }
function extrudeSide(pts, width, mat, bevel = 0.06) {
  const g = new THREE.ExtrudeGeometry(profileShape(pts), { depth: width - bevel * 2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 4 });
  g.translate(0, 0, -(width - bevel * 2) / 2); const m = new THREE.Mesh(g, mat); m.rotation.y = Math.PI / 2; return m;
}
const MATS = {
  ego: new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.2 }),
  glass: new THREE.MeshStandardMaterial({ roughness: 0.15, metalness: 0.4 }),
  tire: new THREE.MeshStandardMaterial({ color: 0x111317, roughness: 0.9 }),
};
function wheels(grp, W, r, axles) { const g = new THREE.CylinderGeometry(r, r, 0.26, 16); g.rotateZ(Math.PI / 2);
  axles.forEach(z => [-1, 1].forEach(s => { const w = new THREE.Mesh(g, MATS.tire); w.position.set(s * (W / 2 - 0.1), r, z); grp.add(w); })); }
function addShadow(grp, L, W) { const m = new THREE.Mesh(new THREE.PlaneGeometry(W * 1.35, L * 1.25), new THREE.MeshBasicMaterial({ color: 0, transparent: true, alphaMap: shadowTex, opacity: 0.5, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.015; grp.add(m); grp.userData.shadow = m; }
function makeCar(kind, bodyMat) {
  const grp = new THREE.Group(); let L, W;
  if (kind === 'car' || kind === 'ego') {
    L = 4.6; W = 1.86;
    const b = extrudeSide([[0, 0.32], [0, 0.92], [0.35, 1.0], [3.5, 1.0], [4.35, 0.84], [4.6, 0.62], [4.6, 0.32]], W, bodyMat);
    const c = extrudeSide([[0.55, 0.98], [1.15, 1.42], [2.85, 1.45], [3.55, 0.98]], W - 0.16, MATS.glass, 0.05);
    const roof = extrudeSide([[1.2, 1.40], [2.8, 1.43], [2.8, 1.48], [1.25, 1.46]], W - 0.3, bodyMat, 0.04);
    [b, c, roof].forEach(m => { m.position.z = L / 2; grp.add(m); });
    wheels(grp, W, 0.34, [L / 2 - 0.85, -L / 2 + 0.9]);
    if (kind === 'ego') { const tl = new THREE.Mesh(new THREE.BoxGeometry(W - 0.25, 0.06, 0.02), new THREE.MeshBasicMaterial({ color: 0xff4a4a })); tl.position.set(0, 0.86, L / 2 + 0.07); grp.add(tl); }
  } else if (kind === 'big') {
