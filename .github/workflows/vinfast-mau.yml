# Tam thoi: xem cac truong co trong du lieu tram sac VinFast (cong, kW, dia chi...) de bo sung vao CSDL tram sac.
name: Xem mau du lieu VinFast
on:
  push:
    paths: [".github/workflows/vinfast-mau.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mau:
    runs-on: ubuntu-latest
    steps:
      - name: Lay mau
        run: |
          python3 - <<'PY'
          import gzip, json, urllib.request, collections
          CDN = "https://static-cms-prod.vinfastauto.com/locators/"
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 EVCarHUD"}), timeout=180).read()
              return gzip.decompress(r) if r[:2] == b"\x1f\x8b" else r
          meta = json.loads(get(CDN + "locators-meta.json"))
          d = json.loads(get(CDN + meta["full"]))
          rows = d["data"] if isinstance(d, dict) else d
          car = [r for r in rows if r.get("category_slug") == "car_charging_station"]
          keys = collections.Counter(k for r in car for k, v in r.items() if v not in (None, "", [], {}))
          cats = collections.Counter(r.get("category_slug") for r in rows)
          out = {"meta": meta, "top_keys": type(d).__name__ + ":" + (",".join(d.keys()) if isinstance(d, dict) else ""), "categories": cats, "car_count": len(car), "filled_keys": keys, "samples": car[:4] + car[5000:7] + car[-3:]}
          try:
              sc = json.loads(get(CDN + meta["sc"]))
              scr = sc["data"] if isinstance(sc, dict) and "data" in sc else sc
              out["sc_type"] = type(sc).__name__ + ":" + (",".join(list(sc.keys())[:20]) if isinstance(sc, dict) else str(len(sc)))
              out["sc_samples"] = (scr[:3] if isinstance(scr, list) else {k: scr[k] for k in list(scr)[:3]})
          except Exception as e:
              out["sc_err"] = repr(e)
          s0 = car[1]
          tries = {}
          for u in [f"https://vinfastauto.com/vn_vi/get-locator/{s0['entity_id']}", f"https://vinfastauto.com/vn_vi/get-locator?id={s0['entity_id']}",
                    f"https://vinfastauto.com/vn_vi/api/v1/charging-station/{s0['store_id']}", f"https://static-cms-prod.vinfastauto.com/locators/detail/{s0['entity_id']}.json",
                    f"https://vinfastauto.com/vn_vi/tim-kiem-showroom-tram-sac?store={s0['store_id']}"]:
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0", "X-Requested-With": "XMLHttpRequest"}), timeout=30)
                  b = r.read(); b = gzip.decompress(b) if b[:2] == b"\x1f\x8b" else b
                  tries[u] = [r.status, b[:3000].decode("utf-8", "replace")]
              except Exception as e:
                  tries[u] = repr(e)[:300]
          out["detail_tries"] = tries
          json.dump(out, open("vinfast-mau.json", "w"), ensure_ascii=False, indent=1, default=str)
          PY
      - name: Tai len
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload du-lieu-tram-sac vinfast-mau.json --clobber -R ${{ github.repository }}
