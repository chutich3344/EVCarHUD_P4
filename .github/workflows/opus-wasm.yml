name: Build opus.wasm
on:
  push:
    branches: [claude/project-thread-3vo5x8]
    paths: [tools/opus-wasm/**, .github/workflows/opus-wasm.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74
    steps:
      - uses: actions/checkout@v4
      - run: cd tools/opus-wasm && ./build.sh && wasm-objdump -x opus.wasm 2>/dev/null | grep -A20 "^Import" || true
      - name: Dang ban phat hanh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (type gh >/dev/null 2>&1) || (curl -fsSL https://github.com/cli/cli/releases/download/v2.62.0/gh_2.62.0_linux_amd64.tar.gz | tar xz && cp gh_*/bin/gh /usr/local/bin/)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release delete opus-wasm --yes --cleanup-tag || true
          gh release create opus-wasm tools/opus-wasm/opus.wasm --target "$GITHUB_SHA" --title "opus.wasm (libopus 1.5.2)" --notes "Bo ma hoa Opus cho may chu AI." --prerelease
