# Build thu Lidar do cu ly xe phia truoc (nhanh thu nghiem): file gop .bin (nap 0x0) + file app (OTA / trang tai len)
# trong ban phat hanh rieng "lidar-thu".
name: Build thu Lidar

on:
  push:
    branches: [claude/project-thread-neqswx]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build bang ESP-IDF 5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: esp32p4
          command: git config --global --add safe.directory /app/${{ github.repository }} && idf.py build && idf.py merge-bin -o evcarhud-full.bin
      - name: Dat ten file
        run: |
          SHORT=$(git rev-parse --short HEAD)
          VER=$(cat version.txt)
          cp build/evcarhud-full.bin "p4-lidar-$VER-$SHORT.bin"
          cp build/evcarhud_p4.bin "p4-lidar-$VER-$SHORT-app-0x10000.bin"
          ls -la build/evcarhud_p4.bin build/evcarhud-full.bin
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: p4-lidar-${{ env.SHORT }}
          path: p4-lidar-*.bin
      - name: Cap nhat ban phat hanh "lidar-thu"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lidar-thu --yes --cleanup-tag || true
          gh release create lidar-thu p4-lidar-*.bin --target "$GITHUB_SHA" \
            --title "Thử Lidar đo cự ly (${{ env.SHORT }})" \
            --notes "Bản thử Lidar (Nooploop TOFSense-F2 PH / Benewake TF03) qua UART GPIO 5 (RX) / GPIO 4 (TX). Nạp file gộp ở 0x0, hoặc file app qua Cập nhật firmware." --prerelease
