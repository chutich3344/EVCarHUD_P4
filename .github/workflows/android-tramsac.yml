# Build app Android "HUD Tram sac" (thu muc android-tramsac/) tren GitHub, khong can cai Android Studio.
# Moi lan day code -> build APK, dat vao ban phat hanh "app-tram-sac" de tai thang tren dien thoai.
name: Build app Tram sac

on:
  push:
    paths:
      - "android-tramsac/**"
      - ".github/workflows/android-tramsac.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tramsac
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Runner ubuntu-latest da co san Android SDK (ANDROID_HOME); Gradle tu tai platform/build-tools neu thieu.
      - name: Kiem tra nguon VinFast (chi in ra, khong lam hong build)
        continue-on-error: true
        run: |
          curl -sS -A "Mozilla/5.0" https://static-cms-prod.vinfastauto.com/locators/locators-meta.json | tee /tmp/meta.json; echo
          FULL=$(python3 -c "import json;print(json.load(open('/tmp/meta.json'))['full'])")
          curl -sS -A "Mozilla/5.0" -o /tmp/loc.gz "https://static-cms-prod.vinfastauto.com/locators/$FULL"
          ls -la /tmp/loc.gz
          python3 - <<'PY'
          import json, gzip, collections
          raw = open('/tmp/loc.gz','rb').read()
          if raw[:2] == b'\x1f\x8b': raw = gzip.decompress(raw)
          d = json.loads(raw); rows = d['data'] if isinstance(d, dict) else d
          print('tong', len(rows))
          print(collections.Counter(r.get('category_slug') for r in rows).most_common())
          ch = [r for r in rows if r.get('category_slug') == 'car_charging_station']
          print('status', collections.Counter(str(r.get('status')) for r in ch).most_common())
          for r in ch[:3]: print({k: r.get(k) for k in ('name','address','lat','lng','status','store_type','store_model')})
          print('keys', sorted(ch[0].keys()) if ch else None)
          PY

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          SHORT=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/release/app-release.apk "../hud-tram-sac-$SHORT.apk"
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: hud-tram-sac-${{ env.SHORT }}
          path: hud-tram-sac-${{ env.SHORT }}.apk

      - name: Cap nhat ban phat hanh "app-tram-sac"
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-tram-sac --yes --cleanup-tag || true
          gh release create app-tram-sac "hud-tram-sac-$SHORT.apk" --target "$GITHUB_SHA" \
            --title "App HUD Trạm sạc ($SHORT)" \
            --notes "APK build tự động từ commit $SHORT (nhánh ${GITHUB_REF_NAME}). Tải về điện thoại Android rồi cài." --prerelease
